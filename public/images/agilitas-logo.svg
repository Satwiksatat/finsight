<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Agilitas Speed Mark -->
  <g id="speed-mark">
    <!-- Dynamic swoosh lines -->
    <path d="M5 20 L25 20 L30 15" stroke="#FF3333" stroke-width="3" stroke-linecap="round"/>
    <path d="M2 30 L28 30 L33 25" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 40 L25 40 L30 45" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- AGILITAS Text -->
  <g id="wordmark">
    <text x="45" y="38" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1A1A1A" letter-spacing="1">
      AGILITAS
    </text>
  </g>
  
  <!-- Dynamic accent -->
  <circle cx="185" cy="15" r="4" fill="#FF3333">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
